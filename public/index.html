<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RODEO</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0B3D7C; --azul2:#072957; --oro:#C9A24B; --tinta:#10243f;
  --papel:#F7F3EC; --linea:#E2D9CB; --gris:#8A827A;
  --verde:#1a7a4a; --rojo:#B83232;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:Oswald,system-ui,sans-serif;
  font-weight:300;font-size:14px;display:flex;min-height:100vh}
.mono{font-family:'JetBrains Mono',monospace}
main{flex:1;min-width:0;display:flex;flex-direction:column}
button,input,select,textarea{font-family:inherit}

header{background:var(--azul2);color:#fff;padding:15px 20px 0}
.hrow{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.brand{font-size:22px;font-weight:600;letter-spacing:2.5px}
.sub{font-size:11px;color:var(--oro);letter-spacing:2px;margin-top:3px;text-transform:uppercase}
.tabs{display:flex;gap:2px;margin-top:14px;flex-wrap:wrap}
.tab{background:rgba(255,255,255,.09);color:rgba(255,255,255,.72);border:none;padding:10px 14px;
  font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;cursor:pointer;border-radius:4px 4px 0 0}
.tab:hover{background:rgba(255,255,255,.16);color:#fff}
.tab.on{background:var(--papel);color:var(--azul);font-weight:600}
.tab.sep{margin-left:auto}
.selc{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);
  border-radius:4px;padding:5px 9px;font-size:12px;align-self:center}
.selc option{color:#111}
.franja{height:4px;background:var(--oro)}

/* ── Buscador global ─────────────────────────────────────────────── */
.gs{position:relative;margin-left:auto;align-self:center;width:min(420px,100%)}
.gs input{width:100%;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:4px;
  padding:8px 34px 8px 12px;font-size:14px;letter-spacing:.5px}
.gs input::placeholder{color:rgba(255,255,255,.55)}
.gs input:focus{outline:none;border-color:var(--oro);background:rgba(255,255,255,.18)}
.gs .k{position:absolute;right:9px;top:8px;font-size:10px;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.3);
  border-radius:3px;padding:1px 5px;font-family:'JetBrains Mono',monospace}
.gsr{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;color:var(--tinta);border:1px solid var(--linea);
  border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:80;max-height:420px;overflow:auto;display:none}
.gsr.on{display:block}
.gsr .r{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--linea);cursor:pointer}
.gsr .r:hover,.gsr .r.sel{background:#FAF7F0}
.gsr .r b{font-size:15px;font-weight:500;min-width:64px}
.gsr .r .d{font-size:12px;color:var(--gris);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsr .r .c{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--oro)}
.gsr .vacio{padding:16px;color:var(--gris);text-align:center;font-size:13px}

.kpis{display:flex;gap:1px;background:var(--linea);border-bottom:1px solid var(--linea);flex-wrap:wrap}
.kpi{background:#fff;padding:12px 18px;flex:1;min-width:116px;cursor:pointer;transition:.12s}
.kpi:hover{background:#FAF7F0}
.kpi b{display:block;font-size:25px;font-weight:500;color:var(--azul);line-height:1.1}
.kpi span{font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--gris)}
.kpi.al b{color:var(--rojo)} .kpi.bien b{color:var(--verde)} .kpi.oro b{color:#B8860B}

.bar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--linea);
  padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.bar input,.bar select{font-size:12.5px;padding:7px 10px;border:1px solid var(--linea);
  border-radius:4px;background:#fff;color:var(--tinta)}
.bar input[type=text]{min-width:200px;flex:1;max-width:360px}
.bar input:focus,.bar select:focus{outline:none;border-color:var(--azul)}
.btn{background:var(--azul);color:#fff;border:none;border-radius:4px;padding:7px 15px;
  font-size:11.5px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--azul2)} .btn.g{background:#fff;color:var(--tinta);border:1px solid var(--linea)}
.btn.g:hover{background:#FAF7F0} .btn.r{background:#fff;color:var(--rojo);border:1px solid var(--linea)}
.btn.s{padding:5px 10px;font-size:10.5px}
.btn:disabled{opacity:.5;cursor:default}
.count{margin-left:auto;font-size:11px;color:var(--gris);letter-spacing:1px;text-transform:uppercase}

/* menú desplegable */
.menu{position:relative}
.menu .dd{display:none;position:absolute;left:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--linea);border-radius:4px;
  box-shadow:0 8px 24px rgba(0,0,0,.14);min-width:250px;z-index:50;padding:6px 0}
.menu.on .dd{display:block}
.dd button,.dd label{display:flex;width:100%;text-align:left;background:none;border:none;padding:8px 14px;font-size:13px;
  cursor:pointer;color:var(--tinta);gap:8px;align-items:center}
.dd button:hover,.dd label:hover{background:#FAF7F0}
.dd .t{font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gris);padding:8px 14px 3px}
.dd hr{border:0;border-top:1px solid var(--linea);margin:5px 0}
.dd small{margin-left:auto;color:var(--gris);font-size:11px}
.dd .cols{max-height:320px;overflow:auto;columns:2;column-gap:0}
.dd .cols label{padding:5px 14px;break-inside:avoid}

.scroll{flex:1;overflow:auto;padding:14px 20px 40px}
table{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
.scroll>table{min-width:900px}
thead th{background:var(--azul2);color:#fff;text-align:left;font-size:9.5px;letter-spacing:1.2px;
  text-transform:uppercase;font-weight:400;padding:11px 8px;white-space:nowrap;cursor:pointer;position:sticky;top:0;z-index:5}
thead th:hover{background:var(--azul)}
th.num,td.num{text-align:right}
th .fl{color:var(--oro);margin-left:4px}
td{padding:8px;border-bottom:1px solid var(--linea);white-space:nowrap}
tbody tr:hover{background:#FAF7F0;cursor:pointer}
td.rp{font-weight:500;font-size:14.5px}
td.num{font-family:'JetBrains Mono',monospace;font-size:12px}
.mut{color:var(--gris)} .al{color:var(--rojo);font-weight:500} .bi{color:var(--verde);font-weight:500}
tr.fallo td{background:rgba(184,50,50,.05)}
.tag{font-size:9px;letter-spacing:1.1px;text-transform:uppercase;padding:2px 8px;border-radius:2px;font-weight:500;white-space:nowrap}
.t-cabeza{background:rgba(26,122,74,.14);color:var(--verde)}
.t-cuerpo{background:rgba(11,61,124,.11);color:var(--azul)}
.t-cola{background:rgba(201,162,75,.24);color:#8A6D28}
.t-tardia{background:rgba(184,50,50,.12);color:var(--rojo)}
.t-preñada,.t-activo{background:rgba(11,61,124,.11);color:var(--azul)}
.t-criando{background:rgba(201,162,75,.24);color:#8A6D28}
.t-destetó,.t-ok{background:rgba(26,122,74,.14);color:var(--verde)}
.t-falló,.t-muerto,.t-error{background:rgba(184,50,50,.12);color:var(--rojo)}
.t-vendido,.t-sin{background:rgba(138,130,122,.15);color:var(--gris)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
.vacio{text-align:center;padding:44px;color:var(--gris);background:#fff}
.aviso{background:#fff;border-left:3px solid var(--oro);padding:9px 14px;margin:0 20px 12px;font-size:12px;color:var(--gris)}
.aviso.ok{border-color:var(--verde)} .aviso.mal{border-color:var(--rojo)}

/* ── Paneles (relevar, archivos) ─────────────────────────────────── */
.panel{padding:16px 20px 40px;max-width:1200px}
.sub-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sub-tabs button{background:#fff;border:1px solid var(--linea);border-radius:20px;padding:7px 16px;font-size:12px;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:var(--gris)}
.sub-tabs button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.caja{background:#fff;border:1px solid var(--linea);border-radius:4px;padding:18px 20px;margin-bottom:14px}
.caja h3{margin:0 0 4px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--azul);font-weight:500}
.caja p.ayuda{margin:0 0 14px;font-size:12.5px;color:var(--gris);line-height:1.55;max-width:78ch}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.campo{display:flex;flex-direction:column;gap:4px;min-width:120px}
.campo.w{flex:1;min-width:220px}
.campo label{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gris)}
.campo input,.campo select,.campo textarea{font-size:13.5px;padding:8px 10px;border:1px solid var(--linea);border-radius:4px;background:#fff;color:var(--tinta)}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--azul)}
textarea.lineas{width:100%;min-height:170px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.5;resize:vertical}
.acciones{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.res{margin-top:14px}
.res table{font-size:12.5px;border:1px solid var(--linea)}
.res td,.res th{padding:6px 8px}
.res tbody tr:hover{cursor:default;background:#fff}
.lista{display:flex;flex-direction:column;gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:4px;overflow:hidden}
.lista .it{background:#fff;padding:11px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lista .it b{font-weight:500;font-size:14px}
.lista .it .d{font-size:12px;color:var(--gris);flex:1;min-width:160px}
.lista .it a{color:var(--azul);font-size:12px;letter-spacing:1px;text-transform:uppercase;text-decoration:none;padding:5px 9px;border:1px solid var(--linea);border-radius:3px}
.lista .it a:hover{background:#FAF7F0}
.chip{display:inline-block;font-size:11px;padding:3px 9px;border-radius:12px;background:var(--papel);border:1px solid var(--linea);color:var(--gris);margin:2px 4px 2px 0;cursor:pointer}
.chip:hover{border-color:var(--azul);color:var(--azul)}
.dz{border:2px dashed var(--linea);border-radius:6px;padding:16px;text-align:center;color:var(--gris);font-size:13px;cursor:pointer}
.dz:hover,.dz.over{border-color:var(--azul);color:var(--azul);background:#FAF7F0}

/* ── Ficha ─────────────────────────────────────────────────────────── */
.ov{position:fixed;inset:0;background:rgba(16,36,63,.5);display:none;align-items:flex-start;
  justify-content:center;padding:22px 14px;z-index:60;overflow:auto}
.ov.on{display:flex}
.card{background:var(--papel);border-radius:4px;max-width:1040px;width:100%;overflow:hidden}
.ct{background:var(--azul2);color:#fff;padding:18px 24px;display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.ct h2{margin:0;font-size:29px;font-weight:600;letter-spacing:1.5px;line-height:1}
.ct .id{font-size:11px;color:var(--oro);letter-spacing:1.6px;margin-top:4px;text-transform:uppercase}
.ct .acc{margin-left:auto;display:flex;gap:6px;align-items:center}
.ct .acc button,.ct .acc a{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3);
  height:32px;padding:0 12px;border-radius:3px;cursor:pointer;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center}
.ct .acc button:hover,.ct .acc a:hover{background:rgba(255,255,255,.2)}
.cb{padding:20px 24px 26px}
.fk{display:flex;gap:1px;background:var(--linea);border:1px solid var(--linea);flex-wrap:wrap;margin-bottom:22px}
.fk>div{background:#fff;padding:11px 15px;flex:1;min-width:110px}
.fk span{font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gris);display:block}
.fk b{font-size:20px;font-weight:500;display:block;margin-top:2px}
.fk b.s{font-size:15px}
.fk a{color:var(--azul);text-decoration:none;border-bottom:1px dotted var(--azul)}
h3.s{font-size:12.5px;letter-spacing:2px;text-transform:uppercase;color:var(--azul);
  font-weight:500;margin:22px 0 10px;border-bottom:2px solid var(--linea);padding-bottom:6px;display:flex;align-items:center;gap:10px}
h3.s:first-child{margin-top:0}
h3.s .btn{margin-left:auto}
.corr{background:rgba(201,162,75,.16);color:#8A6D28;font-size:9px;padding:1px 6px;border-radius:2px;margin-left:6px}
.notaCaja{display:flex;gap:8px;margin-top:12px}
.notaCaja input{flex:1;font-size:13px;padding:9px 12px;border:1px solid var(--linea);border-radius:4px}
.tw{overflow:auto;border:1px solid var(--linea)}
.tw table{min-width:0}
.tw tbody tr:hover{cursor:default}
.inl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.inl input{font-size:13px;padding:8px 10px;border:1px solid var(--linea);border-radius:4px;width:110px}

/* ── Chat ──────────────────────────────────────────────────────────── */
.chat{width:340px;flex:0 0 340px;background:#fff;border-left:1px solid var(--linea);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.chh{padding:13px 16px;border-bottom:1px solid var(--linea);background:var(--papel)}
.chh b{font-size:12px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;display:block}
.chh span{font-size:11.5px;color:var(--gris);line-height:1.45;display:block;margin-top:3px}
.msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:11px}
.msg{max-width:92%;padding:9px 12px;border-radius:9px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.yo{align-self:flex-end;background:var(--azul);color:#fff;border-bottom-right-radius:2px}
.msg.bot{align-self:flex-start;background:var(--papel);border:1px solid var(--linea);border-bottom-left-radius:2px}
.msg.bot a{color:var(--azul);font-weight:500}
.msg.pen{color:var(--gris);font-style:italic}
.pasos{font-size:10.5px;color:var(--gris);margin-top:6px;padding-top:6px;border-top:1px solid var(--linea)}
.vivo{display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.vivo .p{font-size:11.5px;color:var(--gris);display:flex;gap:6px;align-items:flex-start}
.vivo .p::before{content:'›';color:var(--oro);font-weight:600}
.vivo .p.err{color:var(--rojo)}
.vivo .pen{font-size:11.5px;color:var(--gris);font-style:italic;opacity:.8;max-height:60px;overflow:hidden;white-space:pre-wrap}
.msg .txt{white-space:pre-wrap}
.chh .nuevo{float:right;background:none;border:1px solid var(--linea);border-radius:3px;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;cursor:pointer;color:var(--gris)}
.chh .nuevo:hover{color:var(--azul);border-color:var(--azul)}
.chh .modelo{font-size:10px;color:var(--oro);letter-spacing:1px;text-transform:uppercase;margin-top:3px;display:block}
.sug{display:flex;flex-direction:column;gap:6px;padding:0 16px 12px}
.sug button{background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:6px 12px;
  font-size:12px;color:var(--gris);cursor:pointer;text-align:left}
.sug button:hover{border-color:var(--azul);color:var(--azul)}
.env{border-top:1px solid var(--linea);padding:11px 14px;display:flex;gap:8px;align-items:center}
.env .clip{background:none;border:1px solid var(--linea);color:var(--gris);border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:16px;flex:none}
.env .clip:hover{border-color:var(--azul);color:var(--azul)}
.adj{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.adj .a{font-size:11.5px;background:var(--papel);border:1px solid var(--linea);border-radius:12px;padding:4px 10px;display:flex;gap:6px;align-items:center;max-width:100%}
.adj .a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.adj .a b{cursor:pointer;color:var(--gris)} .adj .a b:hover{color:var(--rojo)}
.chat.arrastre{outline:3px dashed var(--oro);outline-offset:-6px}
.msg .adjs{font-size:11px;opacity:.85;margin-bottom:4px}
.msg.yo img{max-width:100%;max-height:180px;border-radius:6px;display:block;margin-bottom:6px}
.env input{flex:1;font-size:13px;padding:9px 12px;border:1px solid var(--linea);border-radius:18px}
.env input:focus{outline:none;border-color:var(--azul)}
.env button{background:var(--azul);color:#fff;border:none;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:15px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--azul2);color:#fff;padding:10px 18px;border-radius:4px;
  font-size:13px;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:1000px){
  body{flex-direction:column} .chat{width:100%;flex:none;height:auto;max-height:400px;position:static}
  .gs{width:100%;margin-left:0} .tab{padding:9px 12px;font-size:11px} .tab.sep{margin-left:0}
  .bar input[type=text]{min-width:140px}
}
</style>
</head>
<body>

<main>
  <header>
    <div class="hrow">
      <div><div class="brand" id="hBrand">RODEO</div>
        <div class="sub" id="hSub">Conectando…</div></div>
      <select class="selc" id="selCampo" onchange="cambiarCampo()"></select>
      <div class="gs">
        <input id="gq" placeholder="Buscar cualquier animal: RP, caravana, HBA, madre, padre, nota…" autocomplete="off"
          oninput="buscarGlobal()" onkeydown="teclaBuscar(event)" onfocus="if(this.value)buscarGlobal()">
        <span class="k">/</span>
        <div class="gsr" id="gsr"></div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab on" data-v="plantel" onclick="verVista(this)">Plantel</button>
      <button class="tab" data-v="toros" onclick="verVista(this)">Toros</button>
      <button class="tab" data-v="nac" onclick="verVista(this)">Nacimientos</button>
      <button class="tab" data-v="recria" onclick="verVista(this)">Recría</button>
      <button class="tab" data-v="term" onclick="verVista(this)">Terminación</button>
      <button class="tab" data-v="dest" onclick="verVista(this)">Destinos</button>
      <button class="tab" data-v="fallos" onclick="verVista(this)">No destetaron</button>
      <button class="tab" data-v="animales" onclick="verVista(this)">Todos</button>
      <button class="tab" data-v="empresa" id="tabEmpresa" onclick="verVista(this)" style="display:none">Empresa</button>
      <button class="tab sep" data-v="relevar" onclick="verVista(this)">✎ Relevar</button>
      <button class="tab" data-v="archivos" onclick="verVista(this)">⇩ Archivos</button>
    </div>
  </header>
  <div class="franja"></div>

  <div id="tablaVista">
    <div class="kpis" id="kpis"></div>
    <div id="avisos"></div>

    <div class="bar">
      <input type="text" id="q" placeholder="Filtrar esta tabla…" oninput="pintar()">
      <select id="fpel" onchange="pintar()"><option value="">Pelaje: todos</option></select>
      <select id="fcat" onchange="pintar()"><option value="">Categoría: todas</option></select>
      <select id="fest" onchange="pintar()"><option value="">Estado: todos</option></select>
      <select id="fblo" onchange="pintar()">
        <option value="">Bloque: todos</option><option value="CABEZA">Cabeza</option>
        <option value="CUERPO">Cuerpo</option><option value="COLA">Cola</option><option value="TARDIA">Tardía</option>
      </select>
      <select id="fsex" onchange="pintar()" style="display:none"><option value="">Sexo: todos</option><option value="M">Machos</option><option value="H">Hembras</option></select>
      <button class="btn g s" onclick="limpiarFiltros()" title="Sacar todos los filtros">✕ filtros</button>

      <div class="menu" id="mCols">
        <button class="btn g" onclick="toggleMenu('mCols')">Columnas ▾</button>
        <div class="dd"><div class="t">Mostrar</div><div class="cols" id="colsList"></div>
          <hr><button onclick="resetCols()">Todas las columnas</button></div>
      </div>

      <div class="menu" id="mExp">

// ── Carga ────────────────────────────────────────────────────────────────────
async function cargar(){
  try{
    fetch(`${API}/api/salud`).then(r=>r.json()).then(s=>{ if(s.modelo) document.getElementById('chModelo').textContent = s.modelo + (s.esfuerzo?' · esfuerzo '+s.esfuerzo:''); }).catch(()=>{});
    // Sólo los campos de la empresa que entró (la del campo pedido, o la pedida por nombre).
    // Dentro del portal manda lo que dice la URL (campo y org), nunca lo guardado de otra visita.
    const campoUrl = params.get('campo'), orgUrl = params.get('org');
    if(embebido && !campoUrl) campo = '';
    const q = empresaPedida ? `?empresa=${encodeURIComponent(empresaPedida)}`
      : (campoUrl || orgUrl) ? `?${campoUrl?'de_campo='+encodeURIComponent(campoUrl):''}${campoUrl&&orgUrl?'&':''}${orgUrl?'org='+encodeURIComponent(orgUrl):''}`
      : campo ? `?de_campo=${encodeURIComponent(campo)}` : '';
    const rc = await fetch(`${API}/api/campos${q}`);
    let campos = await rc.json();
    const avisoCampo = rc.headers.get('X-Aviso') ? decodeURIComponent(rc.headers.get('X-Aviso')) : null;
    if(!campos.length) campos = await fetch(`${API}/api/campos`).then(r=>r.json());
    if(avisoCampo){ campo=''; setTimeout(()=>toast(avisoCampo, 9000), 500); }
    const sel=document.getElementById('selCampo');
    sel.innerHTML = campos.map(c=>`<option value="${c.key}" ${c.key===campo?'selected':''}>${esc(c.nombre)} — ${c.animales} cab.</option>`).join('');
    sel.style.display = campos.length>1?'':'none';
    const act = campos.find(c=>c.key===campo)||campos[0];
    if(act){ campo=act.key; document.getElementById('hBrand').textContent=act.nombre.toUpperCase();
      empresaActual = act.empresa; document.getElementById('tabEmpresa').style.display = (act.campos_empresa>1)?'':'none'; }
    camposTodos = campos;
  }catch(e){}
  try{
    const [pl, an, te, de, to] = await Promise.all([
      fetch(urlCampo('/api/plantel')).then(r=>r.json()),
      fetch(urlCampo('/api/animales?estado=TODOS')).then(r=>r.json()),
      fetch(urlCampo('/api/terminacion')).then(r=>r.json()).catch(()=>null),
      fetch(urlCampo('/api/destinos')).then(r=>r.json()).catch(()=>null),
      fetch(urlCampo('/api/toros')).then(r=>r.json()).catch(()=>null)
    ]);
    if(pl.error) throw new Error(pl.error);
    const todos = Array.isArray(an)?an:[];
    D = { plantel: pl, todos, animales: todos.filter(a=>String(a.estado||'ACTIVO').toUpperCase()==='ACTIVO'),
          terminacion: (te && !te.error) ? te : { filas:[], resumen:{} },
          destinos: (de && !de.error) ? de : { filas:[], candidatos:[], resumen:{} },
          toros: (to && !to.error) ? to : { filas:[], resumen:{} } };
    document.getElementById('hSub').textContent =
      `${pl.filas.length} vientres · parición ${pl.anio_paricion} · ${D.animales.length} animales activos`;
    llenarFiltros(); pintar(); if(!document.getElementById('msgs').children.length) cargarConversacion();
    if(vista==='archivos') pintarArchivos();   // relevar no se redibuja: se perdería lo que se está cargando
  }catch(e){
    document.getElementById('hSub').textContent = e.message;
    document.getElementById('tbody').innerHTML=`<tr><td colspan="15" class="vacio">${esc(e.message)}</td></tr>`;
  }
}
function cambiarCampo(){
  campo=document.getElementById('selCampo').value; localStorage.setItem('campo',campo);
  // Dentro del portal el campo viene en la URL: se actualiza ahí también, si no al recargar vuelve el anterior.
  const u=new URL(location.href); u.searchParams.set('campo',campo); location.href=u.toString();
}

function llenarFiltros(){
  const filas = datosDe(vista);
  const uniq = k => [...new Set(filas.map(f=>f[k]).filter(Boolean))].sort();
  const sel=(id,vals,pre)=>{
    const e=document.getElementById(id), act=e.value;
    e.innerHTML=`<option value="">${pre}</option>`+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');
    e.value = vals.includes(act)?act:'';
  };
  sel('fpel', uniq('pelo'), 'Pelaje: todos');
  sel('fcat', uniq('categoria'), 'Categoría: todas');
  sel('fest', uniq('estado'), 'Estado: todos');
  document.getElementById('fsex').style.display = ['animales','nac','recria'].includes(vista)?'':'none';
  document.getElementById('fblo').style.display = ['plantel','nac'].includes(vista)?'':'none';
  if(vista==='animales' && !document.getElementById('fest').value) document.getElementById('fest').value='ACTIVO';
}

function datosDe(v){
  if(!D) return [];
  if(v==='plantel') return D.plantel.filas;
  if(v==='fallos') return D.plantel.filas.filter(f=>f.estado==='FALLÓ');
  if(v==='term') return D.terminacion.filas;
  if(v==='toros') return D.toros.filas;
  if(v==='dest') return D.destinos.filas;
  if(v==='animales') return D.todos;
  const anio = D.plantel.anio_paricion, cortes = D.plantel.calendario && D.plantel.calendario.cortes;
  if(v==='nac') return D.todos.filter(a=>String(a.fecha_nac||'').startsWith(anio) && a.madre_rp).map(a=>({...a, bloque: bloqueDe(a.fecha_nac, cortes)}));
  if(v==='recria') return D.animales.filter(a=>a.edad_meses!=null && a.edad_meses>=6 && a.edad_meses<=20);
  return [];
}
function bloqueDe(f, c){
  if(!f) return null;
  if(c && c.referencia){ if(f<=c.CABEZA) return 'CABEZA'; if(f<=c.CUERPO) return 'CUERPO'; if(f<=c.COLA) return 'COLA'; return 'TARDIA'; }
  const md=String(f).slice(5,10); return md<='08-31'?'CABEZA':md<='09-30'?'CUERPO':md<='10-31'?'COLA':'TARDIA';
}
const colsVisibles = () => VISTAS[vista].cols.filter(c=>{ const o=colsOcultas[vista]||{}; return o[c.k]===undefined ? !c.oculta : !o[c.k]; });

function pintar(){
  if(!D || !VISTAS[vista]) return;
  const R = D.plantel.resumen;
  const conf = VISTAS[vista];
  const filas = filtrar();
  const cols = colsVisibles();

function filtrar(){
  const q=(document.getElementById('q').value||'').trim();
  const nq=norm(q), cq=compacto(q);
  const fp=document.getElementById('fpel').value, fc=document.getElementById('fcat').value;
  const fe=document.getElementById('fest').value, fb=document.getElementById('fblo').value, fs=document.getElementById('fsex').value;
  let filas = datosDe(vista).filter(f=>{
    if(fp && f.pelo!==fp) return false;
    if(fc && f.categoria!==fc) return false;
    if(fe && String(f.estado||'ACTIVO')!==fe) return false;
    if(fb && f.bloque!==fb) return false;
    if(fs && !String(f.sexo||'').toUpperCase().startsWith(fs)) return false;
    if(q){
      const claves=[f.rp,f.nombre,f.hba,f.chip,f.padre,f.padre_rp,f.madre,f.madre_rp,f.ternero,f.lote,f.lote_actual,f.potrero,f.destino,f.motivo_texto,f.causa_texto,f.nota,f.temporadas].filter(Boolean);
      const ok = claves.some(v=>{ const n=norm(v); return n.includes(nq) || compacto(v)===cq; });
      if(!ok) return false;
    }
    return true;
  });
  const c=orden.col;
  filas = [...filas].sort((a,b)=>{
    let x=a[c], y=b[c];
    if(x==null&&y==null) return 0;
    if(x==null) return 1; if(y==null) return -1;
    const r=(typeof x==='number'&&typeof y==='number')?x-y:String(x).localeCompare(String(y),'es',{numeric:true});
    return orden.desc?-r:r;
  });
  return filas;
}
function descripcionFiltros(){
  const p=[]; const q=document.getElementById('q').value.trim(); if(q) p.push(`busca "${q}"`);
  for(const [id,n] of [['fpel','pelaje'],['fcat','categoría'],['fest','estado'],['fblo','bloque'],['fsex','sexo']]){ const v=document.getElementById(id).value; if(v) p.push(`${n} ${v}`); }
  return p.join(', ');
}
function ordenar(c){ if(orden.col===c) orden.desc=!orden.desc; else {orden.col=c;orden.desc=false;} pintar(); }
function filtrarEstado(e){ if(!['plantel','animales'].includes(vista)) return; document.getElementById('fest').value = e||''; pintar(); }
function limpiarFiltros(){ ['q','fpel','fcat','fest','fblo','fsex'].forEach(i=>document.getElementById(i).value=''); pintar(); }
function toggleCol(k,on){ colsOcultas[vista]=colsOcultas[vista]||{}; colsOcultas[vista][k]=!on; localStorage.setItem('colsOcultas',JSON.stringify(colsOcultas)); pintar(); }
function resetCols(){ delete colsOcultas[vista]; localStorage.setItem('colsOcultas',JSON.stringify(colsOcultas)); pintar(); }
function toggleMenu(id){
  const m=document.getElementById(id); const on=m.classList.contains('on');
  document.querySelectorAll('.menu').forEach(x=>x.classList.remove('on'));
  if(on) return;
  m.classList.add('on');
  // Si el menú se sale por la derecha, se abre hacia la izquierda.
  const dd=m.querySelector('.dd'); dd.style.left='0'; dd.style.right='auto';
  const r=dd.getBoundingClientRect();
  if(r.right>window.innerWidth-8){ dd.style.left='auto'; dd.style.right='0'; }
  if(dd.getBoundingClientRect().left<8){ dd.style.left='0'; dd.style.right='auto'; }
}

function verVista(el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));

  document.getElementById('archivosVista').style.display = vista==='archivos'?'':'none';

  if(vista==='empresa') pintarEmpresa();

  if(vista==='relevar') pintarRelevar();
  if(vista==='archivos') pintarArchivos();
}

// ── Exportar ─────────────────────────────────────────────────────────────────
async function bajar(url, opciones){
  try{
    const r = await fetch(url, opciones);
    if(!r.ok){ let e='Error '+r.status; try{ e=(await r.json()).error||e; }catch(x){} throw new Error(e); }
    const cd = r.headers.get('Content-Disposition')||'';
    const m = cd.match(/filename\*=UTF-8''([^;]+)/); const nombre = m?decodeURIComponent(m[1]):'archivo';
    const blob = await r.blob();
    if(/html/.test(r.headers.get('Content-Type')||'') && !cd){ window.open(URL.createObjectURL(blob),'_blank'); return; }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nombre; a.click();
    toast(`Bajando ${nombre}`);
  }catch(e){ toast('No pude: '+e.message, 4000); }
}
function bajarUrl(path){ bajar(urlCampo(path)); }
function exportar(formato){
  const conf=VISTAS[vista]; const filas=filtrar(); const cols=colsVisibles();
  const body = { conjunto: conf.conjunto, formato, rps: filas.map(f=>f.rp), columnas: cols.map(c=>c.k),
    filtro: descripcionFiltros(), orden, campo, estado: vista==='animales' ? 'TODOS' : undefined };
  if(formato==='html'){
    // Para imprimir se abre en otra pestaña con lo mismo que se ve.
    const f=document.createElement('form'); f.method='POST'; f.action=urlCampo('/api/exportar'); f.target='_blank';
    for(const [k,v] of Object.entries(body)){ if(v===undefined) continue; const i=document.createElement('input'); i.type='hidden'; i.name=k; i.value=typeof v==='object'?JSON.stringify(v):v; f.appendChild(i); }
    document.body.appendChild(f); f.submit(); f.remove(); return;
  }
  bajar(urlCampo('/api/exportar'), { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
}
function planillaDeVista(formato){
  const filas=filtrar();
  const body={ rps: filas.map(f=>f.rp), titulo:`Relevamiento ${VISTAS[vista].titulo}${descripcionFiltros()?' · '+descripcionFiltros():''}`, formato, campo };
  if(formato==='html'){
    const f=document.createElement('form'); f.method='POST'; f.action=urlCampo('/api/planilla'); f.target='_blank';
    for(const [k,v] of Object.entries(body)){ const i=document.createElement('input'); i.type='hidden'; i.name=k; i.value=typeof v==='object'?JSON.stringify(v):v; f.appendChild(i); }
    document.body.appendChild(f); f.submit(); f.remove(); return;
  }
  bajar(urlCampo('/api/planilla'), { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
}

function teclaBuscar(e){
  const box=document.getElementById('gsr');
  if(e.key==='Escape'){ box.classList.remove('on'); e.target.blur(); return; }
  if(!gsHits.length) return;
  if(e.key==='ArrowDown'){ gsSel=Math.min(gsSel+1,gsHits.length-1); e.preventDefault(); }
  else if(e.key==='ArrowUp'){ gsSel=Math.max(gsSel-1,0); e.preventDefault(); }
  else if(e.key==='Enter'){ if(gsSel>=0) irA(gsHits[gsSel].rp); return; }
  else return;
  [...box.querySelectorAll('.r')].forEach((r,i)=>r.classList.toggle('sel',i===gsSel));
}
function irA(rp){ document.getElementById('gsr').classList.remove('on'); document.getElementById('gq').value=''; abrirFicha(rp); }

  if(e.key==='/' && !/input|textarea|select/i.test(e.target.tagName)){ e.preventDefault(); document.getElementById('gq').focus(); }

});

async function identificarDesdeFicha(rp){
  const rpN=(document.getElementById('idRp')||{}).value, chip=(document.getElementById('idChip')||{}).value;
  if(!rpN && !chip) return toast('Poné el RP definitivo o el chip');
  try{
    const r=await fetch(urlCampo('/api/relevar/identificar'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filas:[{rp_actual:rp, rp:rpN||undefined, chip:chip||undefined}]})}).then(x=>x.json());
    if(r.error) throw new Error(r.error);
    const f=r.filas[0]; if(!f.ok) throw new Error(f.error);
    toast(`Listo${f.avisos.length?' · '+f.avisos.join('; '):''}`,4000);
    abrirFicha(f.rp_nuevo||rp); cargar();
  }catch(e){ toast(e.message,4000); }
}

async function guardarPesada(rp){

    if(r.error) throw new Error(r.error);
    const f=r.filas[0];

}
async function guardarNota(rp){
  const el=document.getElementById('fNota'), texto=el.value.trim(); if(!texto) return;

function valorRel(k){ const e=document.getElementById('rel_'+k); return e?e.value:undefined; }
let relPrevio=null;
async function relevar(simular){
  const texto=(document.getElementById('relTexto')||{}).value||'';
  const est=document.getElementById('relEstado'); est.textContent=simular?'Revisando…':'Cargando…';
  let url, body;
  try{
    if(relTab==='pesadas'){ url='/api/relevar/pesadas'; body={ texto, fecha:valorRel('fecha'), contexto:valorRel('contexto'), simular }; }
    else if(relTab==='mediciones'){ url='/api/relevar/mediciones'; body={ texto, fecha:valorRel('fecha'), tipo:valorRel('tipo'), simular }; }
    else if(relTab==='notas'){ url='/api/relevar/notas'; body={ texto, fecha:valorRel('fecha'), simular }; }
    else if(relTab==='sanidad'){ url='/api/relevar/sanidad'; const q=valorRel('quien');
      body={ fecha:valorRel('fecha'), producto:valorRel('producto'), dosis:valorRel('dosis'), motivo:valorRel('motivo'), simular,
        ...(q==='todos'?{todos:true}:q==='lote'?{lote_id:Number(valorRel('lote'))}:{texto}) }; }
    else if(relTab==='nacimientos'){ url='/api/relevar/nacimientos';
      const porControl = (valorRel('identificacion')||'control')==='control';
      const filas=texto.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{ const p=l.split(/[\s,;\t]+/); return { ...(porControl?{caravana_control:p[0]}:{rp:p[0]}), madre_rp:p[1], fecha_nac:p[2], sexo:p[3], peso_nac:p[4], pelo:p[5], padre_rp:p.slice(6).join(' ')||undefined }; });
      body={ filas, simular, color: valorRel('color')||undefined }; }
    else if(relTab==='identificar'){ url='/api/relevar/identificar'; body={ texto, por: valorRel('por')||'control', color: valorRel('color')||undefined, simular }; }
    else if(relTab==='csv'){ url='/api/importar/csv'; body={ texto, tipo:valorRel('tipo')||undefined, fecha:valorRel('fecha'), contexto:valorRel('contexto'), simular }; }
    if(!texto.trim() && !(relTab==='sanidad' && valorRel('quien')!=='rps')) throw new Error('No hay nada para cargar');
    const r=await fetch(urlCampo(url),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(x=>x.json());
    if(r.error) throw new Error(r.error);
    relPrevio=r;
    est.textContent=r.mensaje;
    document.getElementById('relConfirmar').disabled = !(simular && r.bien>0);
    const filas=r.filas||[];
    document.getElementById('relRes').innerHTML = `
      <div class="aviso ${r.mal&&!r.bien?'mal':r.mal?'':'ok'}" style="margin:0 0 10px"><b>${esc(r.mensaje)}</b>${r.tipo?` · detectado: ${r.tipo}${r.mapa?' · columnas: '+esc(Object.entries(r.mapa).map(([a,b])=>a+'='+b).join(', ')):''}`:''}</div>
      ${filas.length?`<div class="tw"><table><thead><tr><th>#</th><th>RP</th><th>Dato</th><th>Anterior</th><th>Resultado</th></tr></thead><tbody>
      ${filas.map(f=>`<tr><td class="mut">${f.fila||''}</td><td class="rp">${esc(f.rp||'')}</td>
        <td>${f.peso!=null?f.peso+' kg':f.valor!=null?f.tipo+' '+f.valor:f.fecha_nac?`${f.sexo} · ${fec(f.fecha_nac)} · ${f.peso_nac??'—'} kg · madre ${esc(f.madre||'—')}${f.control?' · control '+esc(f.control)+(f.color?' '+esc(f.color):'')+(f.provisorio?' → RP provisorio '+esc(f.rp):''):''}`:f.rp_nuevo||f.chip?`${f.rp_actual?esc(f.rp_actual)+' → ':''}${f.rp_nuevo?'RP '+esc(f.rp_nuevo):''}${f.chip?' · chip '+esc(f.chip):''}`:f.texto?esc(f.texto):''}${f.fecha&&f.peso!=null?` <span class="mut">${fec(f.fecha)}</span>`:''}</td>
        <td class="mut">${f.anterior!=null?`${f.anterior} kg (${fec(f.fecha_anterior)})${f.diferencia!=null?` <span class="${f.diferencia>=0?'bi':'al'}">${f.diferencia>0?'+':''}${f.diferencia}</span>`:''}${f.gdp!=null?` · ${f.gdp} kg/d`:''}`:''}</td>
        <td>${f.ok?(f.hecho?'<span class="tag t-ok">cargado</span>':'<span class="tag t-preñada">listo</span>'):`<span class="tag t-error">no</span> <span class="al">${esc(f.error||'')}</span>`}${f.avisos&&f.avisos.length?` <span class="mut">⚠ ${esc(f.avisos.join('; '))}</span>`:''}</td></tr>`).join('')}
      </tbody></table></div>`:''}`;
    if(!simular && r.bien){ toast(r.mensaje,4000); cargar(); }
  }catch(e){ est.textContent=''; document.getElementById('relRes').innerHTML=`<div class="aviso mal" style="margin:0">${esc(e.message)}</div>`; document.getElementById('relConfirmar').disabled=true; }
}
function leerCsv(file){ if(!file) return; const r=new FileReader(); r.onload=()=>{ document.getElementById('relTexto').value=r.result; document.getElementById('csvNombre').textContent=file.name; relevar(true); }; r.readAsText(file,'utf-8'); }

function emitirPlanilla(formato){
  const o=document.getElementById('plOrigen').value;
  const body={ formato, titulo:document.getElementById('plTit').value, columnas:document.getElementById('plCols').value.split(',').map(s=>s.trim()).filter(Boolean), campo };
  if(o.startsWith('conjunto:')) body.conjunto=o.slice(9);
  else if(o==='rps') body.rps=document.getElementById('relTexto').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  else if(o==='lotes') body.lote_id=Number(document.getElementById('plLote').value);
  if(formato==='html'){
    const f=document.createElement('form'); f.method='POST'; f.action=urlCampo('/api/planilla'); f.target='_blank';
    for(const [k,v] of Object.entries(body)){ if(v===undefined) continue; const i=document.createElement('input'); i.type='hidden'; i.name=k; i.value=typeof v==='object'?JSON.stringify(v):v; f.appendChild(i); }
    document.body.appendChild(f); f.submit(); f.remove(); return;
  }
  bajar(urlCampo('/api/planilla'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
}

async function trasladar(simular){
  const body={ texto:document.getElementById('trTexto').value, desde:document.getElementById('trDesde').value, hasta:document.getElementById('trHasta').value, fecha:document.getElementById('trFecha').value, motivo:document.getElementById('trMotivo').value, simular };
  const est=document.getElementById('trEstado'); est.textContent=simular?'Revisando…':'Trasladando…';
  try{
    const r=await fetch(`${API}/api/traslados`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(x=>x.json());
    if(r.error) throw new Error(r.error);
    est.textContent=r.mensaje; document.getElementById('trConfirmar').disabled=!(simular&&r.bien>0);
    document.getElementById('trRes').innerHTML=`<div class="tw"><table><thead><tr><th>RP</th><th>Categoría</th><th>Resultado</th></tr></thead><tbody>${r.filas.map(f=>`<tr><td class="rp">${esc(f.rp)}</td><td class="mut">${esc(f.categoria||'')}</td><td>${f.ok?(f.hecho?'<span class="tag t-ok">trasladado</span>':'<span class="tag t-preñada">listo</span>'):'<span class="tag t-error">no</span> <span class="al">'+esc(f.error||'')+'</span>'}${f.avisos&&f.avisos.length?' <span class="mut">⚠ '+esc(f.avisos.join('; '))+'</span>':''}</td></tr>`).join('')}</tbody></table></div>`;
    if(!simular&&r.bien){ toast(r.mensaje,5000); cargar(); }
  }catch(e){ est.textContent=''; document.getElementById('trRes').innerHTML=`<div class="aviso mal">${esc(e.message)}</div>`; }
}

    if(u.error) throw new Error(u.error);
    const d=n=>"US$ "+(n||0).toFixed(2), mil=n=>(n||0).toLocaleString("es-AR");
    t.innerHTML = "Modelo <b>"+esc(u.modelo)+"</b>. Hoy: <b>"+u.hoy.consultas+"</b> consultas, <b>"+d(u.hoy.usd)+"</b>. "
      + "Este mes: <b>"+u.mes.consultas+"</b> consultas, <b>"+d(u.mes.usd)+"</b>. "
      + "Promedio por consulta: "+d(u.periodo.promedio_por_consulta)+". El caché ahorró "+d(u.periodo.ahorro_cache)+" en los últimos 30 días. "
      + "La cifra exacta la cobra Anthropic en <a href=\"https://console.anthropic.com/settings/usage\" target=\"_blank\">su consola</a>.";
    let html = "";
    if(u.por_dia.length){
      html = "<div class=\"tw\" style=\"margin-top:10px\"><table><thead><tr><th>Día</th><th class=\"num\">Consultas</th>"
        + "<th class=\"num\">Entrada</th><th class=\"num\">Salida</th><th class=\"num\">Caché leído</th><th class=\"num\">US$</th></tr></thead><tbody>"

// ── Chat ─────────────────────────────────────────────────────────────────────
function linkear(texto){
  return esc(texto).replace(/(\/(archivos|t)\/[^\s)<>"]+)/g, (m)=>`<a href="${urlCampo(m)}" ${m.startsWith('/t/')?'target="_blank"':''}>${m}</a>`)
    .replace(/\b(https?:\/\/[^\s<>"]+)/g, '<a href="$1" target="_blank">$1</a>');
}
function msg(quien,texto,pasos){
  const d=document.createElement('div'); d.className='msg '+quien;
  if(quien==='bot') d.innerHTML=linkear(texto); else d.textContent=texto;
  if(pasos&&pasos.length){
    const p=document.createElement('div'); p.className='pasos';
    const partes=[]; const nc=pasos.filter(x=>x.tipo==='consulta').length; if(nc) partes.push(nc+' consulta(s)');
    if(pasos.some(x=>x.tipo==='escritura')) partes.push('escribió'); if(pasos.some(x=>x.tipo==='archivo')) partes.push('armó un archivo'); if(pasos.some(x=>x.tipo==='tablero')) partes.push('armó un tablero');
    p.textContent=partes.join(' · '); d.appendChild(p);
  }
  const m=document.getElementById('msgs'); m.appendChild(d); m.scrollTop=m.scrollHeight; return d;
}
function saludo(){
  msg('bot','Preguntame lo que quieras del rodeo. Consulto la base antes de responder. También armo archivos, cargo lo que anotaste y recuerdo lo que me contás del campo.');
  document.getElementById('sug').innerHTML=[
    '¿cómo viene la parición?',
    '¿cuál es la vaca más eficiente y por qué?',
    'dame un excel de las vacas que no destetaron',
    '¿hay algo mal cargado?'
  ].map(s=>`<button onclick="usar(this)">${s}</button>`).join('') + '<div class="mut" style="font-size:11px;padding:4px 2px">📎 También le podés mandar una foto de la libreta, un Excel, un CSV o un PDF: arrastralo acá o pegalo.</div>';
}
async function cargarConversacion(){
  try{
    const c = await fetch(urlCampo(`/api/conversacion?sesion=${encodeURIComponent(sesion)}`)).then(r=>r.json());

    c.forEach(m=>{ msg(m.role==='user'?'yo':'bot', m.texto); });

  }catch(e){ saludo(); }
}

  document.getElementById('msgs').innerHTML=''; historia=[]; saludo();
}
function usar(b){ document.getElementById('txt').value=b.textContent; enviar(); }

// ── Adjuntos: fotos, PDF, Excel, CSV, Word ─────────────────────────────────
let adjuntos = [];   // [{nombre, mime, base64, vista}]
const chatEl = document.querySelector('.chat');
chatEl.addEventListener('dragover', e=>{ e.preventDefault(); chatEl.classList.add('arrastre'); });
chatEl.addEventListener('dragleave', ()=>chatEl.classList.remove('arrastre'));
chatEl.addEventListener('drop', e=>{ e.preventDefault(); chatEl.classList.remove('arrastre'); agregarAdjuntos(e.dataTransfer.files); });
function pegar(e){ const items=[...(e.clipboardData||{}).items||[]].filter(i=>i.kind==='file'); if(items.length){ e.preventDefault(); agregarAdjuntos(items.map(i=>i.getAsFile())); } }
async function agregarAdjuntos(files){
  for(const f of [...files]){
    if(!f) continue;
    if(f.size > 40*1024*1024){ toast(`${f.name} pesa más de 40 MB`,4000); continue; }
    try{
      const a = /^image\//.test(f.type) ? await achicarImagen(f) : { nombre:f.name, mime:f.type||'application/octet-stream', base64: await base64De(f) };
      adjuntos.push(a);
    }catch(e){ toast('No pude leer '+f.name+': '+e.message,4000); }
  }
  pintarAdjuntos();
}
const base64De = f => new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]); r.onerror=no; r.readAsDataURL(f); });
// Las fotos del teléfono pesan 5-12 MB: se achican a 1800 px como JPG antes de mandarlas.
function achicarImagen(f){
  return new Promise((ok,no)=>{
    const img=new Image(); const url=URL.createObjectURL(f);
    img.onload=()=>{
      const max=1800, esc=Math.min(1, max/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*esc); c.height=Math.round(img.height*esc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const data=c.toDataURL('image/jpeg',0.85); URL.revokeObjectURL(url);
      ok({ nombre: f.name.replace(/\.[^.]+$/,'')+'.jpg', mime:'image/jpeg', base64: data.split(',')[1], vista: data });
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); no(new Error('no es una imagen que pueda abrir')); };
    img.src=url;
  });
}
function pintarAdjuntos(){
  document.getElementById('adj').innerHTML = adjuntos.map((a,i)=>`<div class="a" title="${esc(a.nombre)}">${a.vista?'🖼':/pdf/.test(a.mime)?'📄':/sheet|excel|csv/.test(a.mime+a.nombre)?'📊':'📎'} <span>${esc(a.nombre)}</span> <b onclick="adjuntos.splice(${i},1);pintarAdjuntos()">✕</b></div>`).join('');
}

// Manda la pregunta (y los adjuntos) y va mostrando lo que el bot hace mientras piensa.
async function enviar(){
  const el=document.getElementById('txt'), t=el.value.trim(); if(!t && !adjuntos.length) return;
  const misAdjuntos = adjuntos; adjuntos=[]; pintarAdjuntos();
  el.value='';
  const mio = msg('yo', t || (misAdjuntos.length?'':''));
  if(misAdjuntos.length){
    const d=document.createElement('div'); d.className='adjs';
    misAdjuntos.forEach(a=>{ if(a.vista){ const im=document.createElement('img'); im.src=a.vista; d.appendChild(im); } const s=document.createElement('div'); s.textContent='📎 '+a.nombre; d.appendChild(s); });
    mio.insertBefore(d, mio.firstChild);
  }
  document.getElementById('sug').innerHTML='';
  const p=msg('bot',''); p.classList.add('pen');
  const vivo=document.createElement('div'); vivo.className='vivo'; p.appendChild(vivo);
  const pen=document.createElement('div'); pen.className='pen'; pen.textContent='pensando…'; vivo.appendChild(pen);
  const txt=document.createElement('div'); txt.className='txt'; p.appendChild(txt);
  const m=document.getElementById('msgs');
  let texto='', pensando='', fin=null;
  const paso=(texto,err)=>{ const d=document.createElement('div'); d.className='p'+(err?' err':''); d.textContent=texto; vivo.insertBefore(d,pen); m.scrollTop=m.scrollHeight; };
  const procesar=ev=>{
    if(ev.tipo==='vuelta'){ if(texto.trim()){ paso(texto.trim()); } texto=''; txt.textContent=''; pensando=''; pen.textContent='pensando…'; pen.style.display=''; }
    else if(ev.tipo==='pensando'){ pensando+=ev.delta; pen.textContent=pensando.slice(-160); }
    else if(ev.tipo==='texto'){ texto+=ev.delta; txt.textContent=texto; pen.style.display='none'; m.scrollTop=m.scrollHeight; }
    else if(ev.tipo==='paso'){ paso(ev.texto, ev.error); pen.textContent='pensando…'; }
    else if(ev.tipo==='adjuntos'){ ev.adjuntos.forEach(a=>paso(a.error?`${a.nombre}: ${a.error}`:`leí ${a.nombre}${a.hojas?' ('+a.hojas.map(h=>h.nombre+': '+h.filas+' filas').join(', ')+')':''}`, !!a.error)); }
    else if(ev.tipo==='fin'||ev.tipo==='error'){ fin=ev; }
  };
  try{
    const r=await fetch(urlCampo('/api/chat/stream'),{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({mensaje:t, sesion, adjuntos: misAdjuntos.map(a=>({nombre:a.nombre, mime:a.mime, base64:a.base64}))})});
    if(!r.ok || !r.body){ throw new Error('El servidor respondió '+r.status); }
    const lector=r.body.getReader(); const dec=new TextDecoder(); let buf='';
    while(true){
      const {value,done}=await lector.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let i; while((i=buf.indexOf('\n\n'))>=0){
        const bloque=buf.slice(0,i); buf=buf.slice(i+2);
        for(const linea of bloque.split('\n')){ if(linea.startsWith('data: ')){ try{ procesar(JSON.parse(linea.slice(6))); }catch(e){} } }
      }
    }
    if(!fin) throw new Error('Se cortó la conexión');
    p.classList.remove('pen'); pen.remove();
    const resp = fin.respuesta||fin.error||'No entendí.';
    txt.innerHTML=linkear(resp);
    if(fin.pasos&&fin.pasos.length){
      const ps=document.createElement('div'); ps.className='pasos';
      const partes=[]; const nc=fin.pasos.filter(x=>x.tipo==='consulta').length; if(nc) partes.push(nc+' consulta(s)');
      if(fin.pasos.some(x=>x.tipo==='escritura')) partes.push('escribió'); if(fin.pasos.some(x=>x.tipo==='archivo')) partes.push('armó un archivo');
      if(fin.pasos.some(x=>x.tipo==='tablero')) partes.push('armó un tablero'); if(fin.pasos.some(x=>x.tipo==='memoria')) partes.push('anotó en la memoria');
      ps.textContent=partes.join(' · '); p.appendChild(ps);
    }
    historia.push({role:'user',content:t},{role:'assistant',content:resp});
    if(fin.pasos&&fin.pasos.some(x=>x.tipo==='escritura')) setTimeout(cargar,600);
    if(fin.pasos&&fin.pasos.some(x=>x.tipo==='archivo'||x.tipo==='tablero'||x.tipo==='memoria') && vista==='archivos') pintarArchivos();
    m.scrollTop=m.scrollHeight;
  }catch(e){ p.classList.remove('pen'); pen.remove(); txt.textContent='No pude conectar: '+e.message; }
}
cargar();
